name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@80d3ec0d49901ddda4af788aeb3b1b51e21c07cc # master
    permissions:
      contents: read
      issues: write
