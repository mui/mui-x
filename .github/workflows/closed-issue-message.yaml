name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@5b06c5cc0d2df4dc0a8dc4ab1fb212a32468a074 # master
    permissions:
      contents: read
      issues: write
