name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@8f789e5a8fe2888b5f5837b6a5f64c58837e0e18 # master
    permissions:
      contents: read
      issues: write
