name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@d15ad292b4ac08fbfbb55aebffb354f659d71aea # master
    permissions:
      contents: read
      issues: write
