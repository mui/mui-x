name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@2266e66cb9b09ec1f0439b053aee05549f1f5f25 # master
    permissions:
      contents: read
      issues: write
