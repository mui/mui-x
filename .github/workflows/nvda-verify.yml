# Temporary: verifies https://github.com/mui/mui-x/issues/23101 with a real NVDA. Do not merge.
name: NVDA verify

on:
  pull_request:
    paths:
      - '.github/nvda/**'
      - '.github/workflows/nvda-verify.yml'
      - 'packages/x-date-pickers/src/PickersTextField/**'
      - 'test/e2e/fixtures/DatePicker/Nvda*'

permissions: {}

concurrency:
  group: nvda-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fixtures (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        variant: [master, fixed]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use PickersTextField from the PR base
        if: matrix.variant == 'master'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA" -- packages/x-date-pickers/src/PickersTextField
          git diff --cached --stat
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm -F ./test/e2e build
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ matrix.variant }}
          path: test/e2e/build
          retention-days: 7

  nvda:
    name: NVDA (${{ matrix.browser }})
    needs: build
    runs-on: windows-2025
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    defaults:
      run:
        shell: bash
        working-directory: .github/nvda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/nvda
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: site-*
          path: .github/nvda/sites
      - name: Install harness
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @playwright/test@1.63.0 @guidepup/playwright@0.19.1 @guidepup/guidepup@0.35.0 serve@14.2.6
      - name: Set up NVDA
        run: |
          npx -y @guidepup/setup@0.29.1 setup --ci
          npx -y @guidepup/setup@0.29.1 install
      - run: npx playwright install ${{ matrix.browser }}
      - run: npx playwright test --project ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nvda-${{ matrix.browser }}
          path: |
            .github/nvda/test-results
            .github/nvda/playwright-report
          retention-days: 7
